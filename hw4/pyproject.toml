[project]
name = "hw4"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.11",
    "google-genai>=2.32.0",
    "mcp>=1.29,<2",
    "mcp-server-git==2025.12.18",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "--basetemp=temp"
norecursedirs = ["temp", ".pytest_tmp"]
